<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#c4291c" />
    <title>Sem conexão · Shalon Admin</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f7f2ea; color: #1e1814; font-family: system-ui, sans-serif; }
      main { width: min(100%, 420px); padding: 28px; border: 1px solid #e8dccb; border-radius: 18px; background: white; }
      .marca { color: #c4291c; font-weight: 800; letter-spacing: .02em; }
      h1 { margin: 18px 0 8px; font-size: 24px; }
      p { color: #584e45; line-height: 1.5; }
      button { min-height: 44px; margin-top: 14px; padding: 0 18px; border: 0; border-radius: 11px; background: #c4291c; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="marca">PIZZARIA SHALON · ADMIN</div>
      <h1>Sem conexão no momento</h1>
      <p>Pedidos e operações de caixa precisam de internet para mostrar dados atualizados. Reconecte-se antes de continuar.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
